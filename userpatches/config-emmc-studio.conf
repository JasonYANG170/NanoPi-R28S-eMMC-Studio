# Official NanoPi R28S board configuration, Debian 13 minimal image.
# Variables and hooks below are consumed by the Armbian framework.
# shellcheck disable=SC2034
BOARD=nanopi-r28s
BRANCH=vendor
RELEASE=trixie
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
EXPERT=yes
COMPRESS_OUTPUTIMAGE=sha,img
SHARE_LOG=no
HOST=emmc-studio

# The matching board patch is included in Armbian's U-Boot artifact cache key.
function post_family_config__emmc_studio_sd_only() {
    [[ "$BOARD" == nanopi-r28s && "$BOOTCONFIG" == hinlink_rk3528_defconfig ]] || exit_with_error 'Unexpected SD-only board configuration'
    [[ "$BOOTSOURCE" == https://github.com/radxa/u-boot.git ]] || exit_with_error 'Unexpected SD-only U-Boot source'
    BOOTBRANCH='commit:39cd993e5d6296635438e84f4576b3a9bf76f86e'
}

function pre_config_uboot_target__emmc_studio_sd_only() {
    [[ "$BOARD" == nanopi-r28s ]] || exit_with_error 'SD-only policy is board-specific'
    [[ -f "configs/$BOOTCONFIG" ]] || exit_with_error 'SD-only defconfig is missing'
    sed -i '/^CONFIG_EMMC_STUDIO_SD_ONLY=/d; /^# CONFIG_EMMC_STUDIO_SD_ONLY is not set$/d' "configs/$BOOTCONFIG"
    printf '\nCONFIG_EMMC_STUDIO_SD_ONLY=y\n' >> "configs/$BOOTCONFIG"
}

function post_uboot_custom_postprocess__emmc_studio_sd_only() {
    grep -qx 'CONFIG_EMMC_STUDIO_SD_ONLY=y' .config || exit_with_error 'SD-only config was not enabled'
    # Armbian's explicit FIT targets produce the ELF, but not u-boot.bin.
    grep -aFq 'Bootdev(policy): mmc 1 (SD only)' u-boot || exit_with_error 'U-Boot policy marker is missing'
    grep -aFq 'eMMC Studio SPL: SD only' spl/u-boot-spl.bin || exit_with_error 'SPL policy marker is missing'
    [[ "$BOOT_SCENARIO" == spl-blobs ]] || exit_with_error 'SD-only policy requires the compiled SPL'
    echo 'PASS: compiled U-Boot and SPL both enforce SD-only boot.'
}
